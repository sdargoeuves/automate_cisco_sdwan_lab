[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdwan-automation"
version = "2.3.1"
description = "Cisco SD-WAN Certificate Automation"
requires-python = ">=3.11"
dependencies = [
    "netmiko>=4.6.0",
    "requests>=2.32.5",
    "cisco-sdwan>=1.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[project.scripts]
sdwan-automation = "sdwan_automation:main"

[tool.setuptools]
py-modules = ["sdwan_automation"]
packages = ["components", "utils", "utils.templates"]

[tool.setuptools.package-data]
"utils.templates" = ["*.yml"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort/import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter; avoid noisy string/comment failures
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
