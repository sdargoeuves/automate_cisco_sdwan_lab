# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE / REFERENCE — illustrates the structure of the generated variables file
#
# The real file is written by:
#   sdwan-automation generate --host-vars <path/to/host_vars>
# and lives at:
#   ~/.config/sdwan-automation/variables.yml
#
# Edit the base template (~/.config/sdwan-automation/base.yml) and re-run
# `generate` to update the real file — do not edit the generated YAML directly.
#
# If you are NOT using netlab, this example shows every value you would need to
# populate by hand (management IPs, system IPs, interfaces, BGP ASNs).
# ─────────────────────────────────────────────────────────────────────────────

