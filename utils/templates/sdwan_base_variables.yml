# Static values that cannot be derived from the netlab topology (host_vars/*/topology.json).
# All other fields (IPs, interfaces, BGP ASNs, etc.) are generated automatically
# by the `generate` subcommand from the topology files.


# ── Generator settings ────────────────────────────────────────────────────────
# Controls how the `generate` subcommand identifies transport interfaces on edge
# devices. Each value is a regex pattern matched against the neighbor node name
# recorded in the topology — so "mpls" matches "mpls0", "mpls1", "mpls-provider", etc.
# It HAS TO MATCH the name of the neighbor node in the topology file, otherwise the generator won't be able to identify the transport interfaces and assign IPs correctly.
#
generate:
  mpls_node: '^mpls\d'   # regex matched against neighbor node name → MPLS transport
  inet_node: '^inet\d'   # regex matched against neighbor node name → internet transport

shared:
  org: ipf-netlab
  username: admin             # initial/default username for all components after initial boot (same for manager, controller, validator and edges)
  default_password: admin     # initial/default password for all components after initial boot (same for manager, controller, validator and edges)
  updated_password: admin@123 # new password which will be configured on all components (same for manager, controller, validator and edges)
  port: "443"                 # port for manager APIs
  edge_device_type: cisco_viptela # Netmiko driver for cEdges (controller mode uses config-transaction); set cisco_xe/cisco_ios only if a device rejects it

devices:
  component_site_id: 255   # shared site_id for manager, controller, and validator
  edge_site_id_start: 100  # auto site_ids = edge_site_id_start + n (1-indexed, sorted by name)
  vpn_id: 100              # shared VRF/VPN and OSPF instance ID for all edges

  # edges:
  #   # Edge devices are auto-discovered from the topology (clab.kind == cisco_c8000v).
  #   # site_ids are auto-assigned unless overridden here per device. 
  #   # To override, uncomment and set the site_id for the edge device(s) you want to customize. Make sure to use the correct name as defined in the topology file (e.g., "edge1", "edge2", etc.).
  #   myedge:
  #     site_id: 201




# ---------------------------------------------------------------------------------------------
# EDITING THE VARIABLES BELOW THIS LINE IS OPTIONAL AND SHOULD NOT BE NEEDED FOR MOST USE CASES
# ---------------------------------------------------------------------------------------------
# Timing and retry settings
timing:
  # Startup sequencing — delays between launching each component
  wait_before_automating_validator_seconds: 60
  wait_before_automating_controller_seconds: 120
  manager_api_ready_timeout_seconds: 900        # how long to wait for the manager API after first boot

  # Out-of-sync controller reboot — when vBond/vSmart come up out-of-sync we reboot them.
  # The reboot must finish (and the controller re-sync) before edges are configured;
  # otherwise edges race against a controller restart and BFD never comes up.
  controller_post_reboot_poll_interval_seconds: 30
  controller_post_reboot_timeout_seconds: 600

  # Edge automation
  edge_stagger_seconds: 10          # delay between launching each edge in parallel (seconds)
  wait_before_activating_edge_seconds: 60   # retry pause after a failed `vedge_cloud activate`

  # One-off pause before the FIRST edge activation of a run (0 = disabled).
  # Tested at 180s over 3 runs and it did not help: chassis count was unchanged
  # (14 vs 13 without it) and the position-1 failure it targeted simply moved to
  # position 2. Across 7 measured runs, roughly one edge per run fails its first
  # chassis regardless of position or elapsed time, so the failure looks
  # stochastic rather than something a wait can prevent. Left at 0; the knob
  # stays because it is the cheapest way to re-test if that ever changes.
  wait_before_first_edge_activation_seconds: 0
  wait_after_generating_payg_license_seconds: 30
  edge_cert_poll_interval_seconds: 10
  edge_cert_poll_timeout_seconds: 240            # root CA chain install syslog gate

  # PAYG activation retry — BYOL/PAYG mismatch on Manager can need several retries
  edge_payg_activate_max_attempts: 4
  edge_payg_activate_retry_wait_seconds: 60

  # Edge activations are serialized across worker threads (one edge at a time runs
  # `vedge_cloud activate`). This gap is a small settling pause after activation;
  # the real separation comes from edge_cert_install_hold_* below, which keeps the
  # lock until vManage finishes with this chassis. Everything else stays parallel.
  edge_activation_gap_seconds: 30

  # Hold the activation lock until vManage reaches a terminal cert state
  # (certinstalled / certinstallfailed) for the chassis just activated, so only
  # one CSR is ever in its signing pipeline.
  #
  # Measured over a 3-edge run: every chassis that had the pipeline to itself
  # installed successfully (3/3), and every chassis whose CSR arrived while
  # another was still in flight failed (3/3). A fixed post-activate gap cannot
  # fix this — the CSR only reaches vManage 1m50s-3m after activation, and that
  # lag varies by more than any sane gap value.
  #
  # Timeout is a safety valve: on expiry we release the lock and fall through to
  # the existing fabric gate rather than blocking the run.
  edge_cert_install_hold_poll_interval_seconds: 15
  edge_cert_install_hold_timeout_seconds: 600

  # Infrastructure failures inside an edge worker — SCP of the root cert from the
  # validator, the root-cert install, PAYG generation. These are retried in place
  # after a wait rather than by regenerating a chassis, which cannot fix any of
  # them. Once the budget is spent the run stops and names the real error instead
  # of spending the chassis-retry budget rediscovering it.
  edge_transient_retry_max_attempts: 3
  edge_transient_retry_wait_seconds: 60

  # Whether to serialize the activate -> cert-install cycle across edge workers
  # (the lock described above).
  #
  # Measured over 37 deploys (18 serial / 19 parallel, two labs, interleaved),
  # 2026-08-25 to 08-26:
  #   serial    17/18 clean (94%)   1.43 chassis regenerations per run   ~45 min
  #   parallel  15/19 clean (79%)   1.86 chassis regenerations per run   ~31 min
  # Serial came out ahead in every batch and on every measure — never by much,
  # but never behind either. An interim reading at 24 runs suggested the modes
  # were equal and the default was briefly flipped to false; the larger sample
  # did not support that, so it is back to true.
  #
  # After the netmiko read-timeout fix the speed gap narrowed to ~6 min
  # (34 vs 28), which is a cheap price for the reliability difference.
  #
  # Set false to activate concurrently. Overridable per-run via the
  # SDWAN_SERIALIZE_ACTIVATION environment variable.
  edge_serialize_activation: true

  # Sub-timeout applied *only* while a chassis is still at `tokengenerated`, i.e.
  # vManage has not even begun signing. This is not a shorter version of the hold
  # timeout above: a chassis that has reached `csrgenerated` still gets the full
  # 600s, because a legitimate install has been measured taking up to 392s.
  #
  # Over 30+ activations, `tokengenerated` -> `csrgenerated` took 45-180s. Beyond
  # that the chassis never progressed at all. One run burned 20 minutes on this:
  # 600s stuck in the hold, then another 600s in the fabric gate, before finally
  # regenerating. Bailing at 300s (66% margin over the worst real case) and
  # regenerating straight away turns that 20 minutes into about 5.
  edge_cert_token_stall_timeout_seconds: 300

  # Post-activation device certificate validity check
  # (`show sdwan certificate validity` returns valid once vManage has signed and pushed
  # the device cert back to the edge over the control connection)
  # vManage signing typically takes 5–10 min, so the per-attempt timeout is generous
  # to avoid sending `clear sdwan control connections` while signing is in progress.
  # If the first attempt does time out, attempt 2 sends one `clear` to nudge a
  # genuinely-stuck handshake before giving up.
  edge_cert_validity_poll_interval_seconds: 15
  edge_cert_validity_timeout_seconds: 600
  edge_cert_validity_max_attempts: 2

  # Per-edge cert-retry budget: how many fresh-chassis attempts each edge gets in
  # the multi-edge deploy before it's handed off to `edges failed --cert`.
  edge_cert_retry_max_attempts: 4

  # Final fabric convergence gate. After edge workers finish, automation polls
  # vManage until every targeted edge has at least one BFD session up; edges
  # still at BFD=0 are retried with a fresh cert flow up to this limit.
  edge_bfd_convergence_poll_interval_seconds: 30
  edge_bfd_convergence_timeout_seconds: 300

  # Edge config-readiness gate. A freshly-booted vEdge answers SSH/login before
  # confd is ready to accept `config-transaction`. Before pushing initial edge
  # config, automation probes config mode every poll interval until it succeeds
  # or the timeout elapses, then pushes with normal timing.
  edge_config_ready_poll_interval_seconds: 20
  edge_config_ready_timeout_seconds: 600

  # CSR operations
  wait_csr_generation_seconds: 30      # fixed wait on validator/controller after CSR is requested
  csr_generation_max_attempts: 3       # manager: max retries for the CSR generation API call
  csr_generation_retry_wait_seconds: 5 # manager: wait between CSR generation retries
  csr_file_timeout_seconds: 60         # manager: total budget for CSR file to appear
  csr_file_poll_interval_seconds: 5    # manager: how often to check for the CSR file

  # Netmiko — initial device connection (bootstrap)
  netmiko_connect_retry_wait_seconds: 120
  netmiko_connect_retry_max_seconds: 900
  netmiko_connect_lockout_retry_interval_seconds: 180

  # Netmiko — config push.
  # 60s was too tight: `Pattern not detected` read timeouts during the initial
  # config push show up in 11 runs between 2026-08-19 and 2026-08-26, in both
  # serial and parallel modes. Measured on a contended host, three concurrent
  # edges took 42s / 70s / 83s to push — the two behind the first blew the
  # limit through no fault of the device. This is a ceiling, not a delay, so a
  # larger value costs nothing on a healthy run.
  netmiko_increased_read_timeout_seconds: 180

  # Edge cert diagnostics — `show sdwan ...` can take a while (>30s)
  # Read-only, and a timeout only costs a logged warning
  edge_diagnostic_read_timeout_seconds: 120

  # Netmiko — commit
  netmiko_commit_read_timeout_seconds: 120
  netmiko_commit_retry_attempts: 2
  netmiko_commit_retry_wait_seconds: 30

# certificates:
#   rsa_key: SDWAN.key
#   root_cert: SDWAN.pem
#   signed_cert: NewCertificate.crt
